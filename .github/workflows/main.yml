name: Manual & Weekly Release Tagging

on:
  schedule:
    # Monday 02:00 AM SGT (Sunday 18:00 UTC)
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump Version and Create Tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: ${{ inputs.bump_type || 'patch' }}
          INITIAL_VERSION: 1.0.0
          WITH_V: true

  build:
    needs: tag
    if: ${{ needs.tag.outputs.new_tag }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code at Tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.new_tag }}
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish Unpackaged App
        run: >
          dotnet publish ShortcutManager.csproj
          -c Release 
          -r win-x64 
          --self-contained true 
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=true
          -p:EnableMsixTooling=true
          -p:WindowsPackageType=None
          -p:PlatformTarget=x64
          -p:Version=${{ needs.tag.outputs.new_version }} 
          -o ./publish

      - name: Zip the Output
        shell: pwsh
        run: |
          Get-ChildItem -Path ./publish -Include *.pdb, *.xml -Recurse | Remove-Item -Force
          Compress-Archive -Path ./publish/* -DestinationPath ./ShortcutManager_${{ needs.tag.outputs.new_tag }}_x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: Release ${{ needs.tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
